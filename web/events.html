<!DOCTYPE html>
<html>
<head>
    <title>Detection Events - Gateway</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← Back to Home</a>
        <h1>📋 Detection Event History</h1>
        
        <div class="events-grid" id="events-grid">
            <p>Loading...</p>
        </div>
    </div>
    
    <script>
        // Get event list
        fetch('/api/events')
            .then(res => res.json())
            .then(events => {
                const grid = document.getElementById('events-grid');
                grid.innerHTML = '';  // Clear "Loading..."
                
                if(events.length === 0) {
                    grid.innerHTML = '<p>No detection events yet</p>';
                    return;
                }
                
                // Reverse order (newest first)
                events.reverse().forEach(event => {
                    const card = document.createElement('div');
                    card.className = 'event-card';
                    
                    card.innerHTML = `
                        <img src="/api/thumbnail/${event.filename}" alt="Event">
                        <div class="event-info">
                            <span class="event-type">🚨 Motion Detected</span>
                            <div class="event-time">${event.filename}</div>
                        </div>
                    `;
                    
                    grid.appendChild(card);
                });
            })
            .catch(err => {
                document.getElementById('events-grid').innerHTML = 
                    '<p>Loading failed: ' + err + '</p>';
            });
    </script>
</body>
</html>
