openapi: 3.0.3
info:
  title: Gateway IoT API
  version: 1.0.0
  description: Video surveillance gateway REST API

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /snapshot.jpg:
    get:
      summary: get snapshot
      description: get last frame resize to 640X480 JPEG quality 70
      responses:
        '200':
          description: success get JPEG
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '503':
          description: no frame
          content:
            text/plain:
              schema:
                type: string
                example: "NO frame available"
  /api/events:
    get:
      summary: get all event List
      description: get events dir .jpg all filename
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    filename:
                      type: string
                      example: "motion_1234567890.jpg"
              example:
                - filename: "motion_1234567890.jpg"
                - filename: "motion_1234567891.jpg"
  /api/thumbnail/{filename}:
    get:
      summary: get event thumbnail img
      description: get a specific event image from the events dir
      parameters:
        - name: filename
          in: path
          required: true
          description:  Event image filename (e.g., motion_1234567890.jpg)
          schema:
            type: string
          example: "motion_1234567890.jpg"
      responses:
        '200':
          description: Successfully returned image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Image file not found
          content:
            text/plain:
              schema:
                type: string
                example: "Image not found"
  /api/stats:
    get:
      summary: Get event statistics
      description: Returns the total count of recent events
      responses:
        '200':
          description: Successfully returned statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Total number of recent events
              example:
                total: 10
  /api/config:
    get:
      summary: Get current configuration
      description: Returns the complete system configuration in JSON format
      responses:
        '200':
          description: Successfully returned configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '500':
          description: Failed to retrieve configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "Failed to get config"
    post:
      summary: Update configuration
      description: Updates system configuration with provided JSON data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Config'
      responses:
        '200':
          description: Configuration update result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigUpdateResponse'
              examples:
                success:
                  value:
                    success: true
                failure:
                  value:
                    success: false
                    error: "detector validation failed; "
  /:
    get:
      summary: Serve static web files
      description: Serves HTML, CSS, and JavaScript files from the web directory
      responses:
        '200':
          description: Successfully returned static file
          content:
            text/html:
              schema:
                type: string




components:
  schemas:
    Config:
      type: object
      additionalProperties: true
      description: Dynamic configuration object with flexible structure
      example:
        detector:
          motion_level: 5
          debounce: 3
        rtsp:
          url: "rtsp://127.0.0.1:8554/camera"
          reconnect_interval: 5
        http:
          port: 8080
          stream_quality: 70
          stream_fps: 10
        mqtt:
          enabled: true
          endpoint: "endpoint.iot.region.amazonaws.com"
          port: 8883
    
    ConfigUpdateResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
      required:
        - success